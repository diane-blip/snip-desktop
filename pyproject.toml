[project]
name = "snip-desktop"
version = "0.1.1"
requires-python = "==3.12.*"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".tools", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]
